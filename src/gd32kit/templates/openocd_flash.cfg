# Programs build/blink_pc0.bin into flash by loading fmc_prog.bin (a tiny
# routine built from fmc_prog.c) into RAM and letting the target CPU execute
# it. Direct AP writes to the flash array don't work on this chip (only
# CPU-issued writes reach the flash macro), and the vendor CMSIS-Pack FLM
# algorithm HardFaults through pyOCD on this setup, so this hand-rolled
# routine is the reliable path.

set BLINK_BIN build/blink_pc0.bin
set PROG_RAM_ADDR  0x20001000
set PROG_ENTRY     0x20001014
set DATA_RAM_ADDR  0x20002000
set FLASH_ADDR     0x08000000
set STACK_TOP      0x20020000

reset halt
load_image fmc_prog.bin $PROG_RAM_ADDR bin
load_image $BLINK_BIN $DATA_RAM_ADDR bin

set word_count [expr {([file size $BLINK_BIN] + 3) / 4}]

reg pc $PROG_ENTRY
reg sp $STACK_TOP
reg r0 $FLASH_ADDR
reg r1 $DATA_RAM_ADDR
reg r2 $word_count
resume

# The routine ends in an infinite "bkpt" loop. BKPT_ADDR is computed fresh
# by the Makefile from the just-built fmc_prog.elf (via objdump), so this
# stays correct even when fmc_prog.c changes size and the bkpt shifts.
set done 0
for {set i 0} {$i < 40} {incr i} {
    sleep 500
    halt
    set pc_val [reg pc]
    if {[string first $BKPT_ADDR $pc_val] >= 0} {
        set done 1
        break
    }
    resume
}

if {$done == 0} {
    error "flash routine did not reach the completion breakpoint ($BKPT_ADDR)"
}

echo "Flash programming complete, verifying..."
mdw $FLASH_ADDR 4

reset run
